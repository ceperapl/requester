version: '3'

vars:
  SERVICE_NAME: requester
  BINARY_PATH: ./bin/{{.SERVICE_NAME}}

  # docker images
  HADOLINT_IMAGE: hadolint/hadolint:2.12.0-alpine

tasks:

  default:
    cmds:
      - task -l
    silent: true

  generate:
    desc: Generates golang code for migrations, mocks
    cmds:
      - go generate -x ./...

  hadolint:
    desc: Performs static analysis of dockerfile
    cmds:
      - docker run --rm -i {{.HADOLINT_IMAGE}} < Dockerfile

  go-lint:
    desc: Performs static analysis of Go source code
    cmds:
      - docker run --rm -v $(pwd):/app -w /app golangci/golangci-lint:v1.55.2 golangci-lint run -v ./...

  analysis:
    desc: Performs static analysis of code and configuration
    deps: [hadolint, go-lint]

  build:
    desc: Builds the service
    cmds:
      - CGO_ENABLED=1 go build -race -a -o {{.BINARY_PATH}} .

  test:
    desc: Checks and tests the service
    deps: [generate]
    cmds:
      - |
      - cmd: go test -race $(go list ./... | 
          grep -v github.com/ceperapl/requester/cmd | 
          grep -v github.com/ceperapl/requester/pkg/domain | 
          grep -v github.com/ceperapl/requester/pkg/logging | 
          grep -v github.com/ceperapl/requester/pkg/repository | 
          grep -v github.com/ceperapl/requester/pkg/taskexec/mocks | 
          grep -v github.com/ceperapl/requester/pkg/usecase/mocks | 
          grep -v github.com/ceperapl/requester/pkg/validator/mocks | 
          grep -v github.com/ceperapl/requester/pkg/mq)
          -coverprofile=coverage.out

  coverage:
    desc: Open test coverage html
    deps: [test]
    cmds:
      - cmd: go tool cover -html=coverage.out
