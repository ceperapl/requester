version: '3'
services:
  db:
    image: mongo:latest
    container_name: mongo
    networks:
      - requester
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - 27017:27017

  mq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    networks:
      - requester
    ports:
      - 5672:5672
      - 15672:15672

  requester:
    image: requester:dev
    build:
      context: .
      dockerfile: "./Dockerfile"
    networks:
      - requester
    depends_on:
      - db
      - mq
    ports:
      - 8080:8080
    environment:
      - REQUESTER_MONGODB_URI=mongodb://admin:password@db:27017
      - REQUESTER_RABBITMQ_URI=amqp://guest:guest@mq:5672/
      - REQUESTER_DEBUG=true

networks:
  requester:
    driver: bridge
