version: '3'
services:
  db:
    image: postgres:9.6.14-alpine
    restart: always
    container_name: db
    networks:
      - blanksvc
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=blanksvc
    ports:
      - 5432:5432

  blanksvc:
    image: blanksvc:dev
    build:
      context: .
      dockerfile: "./Dockerfile"
    networks:
      - blanksvc
    depends_on:
      - db
    ports:
      - 8080:8080
      - 9000:9000
    environment:
      - BLANK_POSTGRES_DSN=postgres://user:password@db/blanksvc?sslmode=disable

networks:
  blanksvc:
    driver: bridge
